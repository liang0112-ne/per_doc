<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - per_doc 原型</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="login-page">
  <div class="login-brand">
    <span class="mark">P</span> per_doc
  </div>

  <div class="login-card">
    <h2>文档管理与录入</h2>
    <div class="sub">登录后即可录入与编辑文档</div>

    <div class="alert-error">用户名或密码错误</div>

    <div class="field">
      <label>用户名</label>
      <input class="input" value="admin" placeholder="请输入用户名">
    </div>

    <div class="field">
      <label>密　码</label>
      <input class="input" type="password" value="admin123" placeholder="请输入密码">
    </div>

    <div class="field">
      <button class="btn btn-primary btn-lg">登　录</button>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center;">
      <label style="font-size:13px;color:var(--pd-text-secondary);display:flex;align-items:center;gap:6px;margin:0;">
        <input type="checkbox" checked> 记住我
      </label>
      <a href="#" class="btn-text">忘记密码？</a>
    </div>
  </div>

  <div class="login-foot">
    per_doc v1.0 · 轻量级文档管理系统
    <a href="02-home.html">← 返回原型导航</a>
  </div>
</div>

</body>
</html>
